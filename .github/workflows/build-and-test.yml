name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS / LLVM / ${{ matrix.threading }} / ${{ matrix.integer }}
    runs-on: macos-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        threading: [serial, openmp]
        integer: [lp64, ilp64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install toolchain
        run: |
          brew install llvm flang libomp
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python -m pip install mako numpy

      - name: Show toolchain
        run: |
          clang++ --version
          flang --version

      - name: Configure
        env:
          CC: clang
          CXX: clang++
          FC: flang
        run: |
          cmake -S . -B build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DLINALG_THREADING_MODEL=${{ matrix.threading }} \
            -DLINALG_INTEGER_MODEL=${{ matrix.integer }}

      - name: Build
        run: cmake --build build-ci --parallel 4

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
